name: CI

# Gate every pull request, on any base — stacked feature PRs must still be
# checked. Direct pushes only trigger CI on `main` (post-merge); feature
# branches are covered by their PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, Docker-free gate: typecheck + lint across every workspace.
  static:
    name: typecheck · lint (bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.bun-version == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.3.10', 'latest']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-${{ matrix.bun-version }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        # The @kotodama/web typecheck script feeds `next typegen` its own
        # placeholder env (types don't depend on the value) — no env needed here.
        run: bun run tsc
      - name: Lint
        run: bun run lint

  # Per-workspace Vitest (jsdom). No Docker/Testcontainers — the FE has no
  # database or queue. `bun run test` fans out to each workspace's own
  # `bun --bun vitest run` (a single aggregate `vitest run` is unreliable on
  # this toolchain — see .claude/rules/tooling.md).
  test:
    name: test (bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.bun-version == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.3.10', 'latest']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-${{ matrix.bun-version }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test

  # Storybook must build (AC-6). Uses the @storybook/react-vite builder — the
  # only place Vite runs.
  storybook:
    name: storybook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build Storybook
        run: bun run --filter '@kotodama/ui' build-storybook

  # Human-docs link integrity (human-docs.md clause 6): a renamed link target is a
  # broken link. `--offline` checks ONLY the relative links in `readme.md` against the
  # checked-out tree — the exact thing a rename breaks. External URLs (badges, the
  # Notion specs) aren't a code-change drift vector and only add network flakiness, so
  # they're skipped. (Scoped to readme.md — the repo has no docs/ tree.)
  links:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            readme.md
          fail: true

  # End-to-end (Playwright) against a REAL running app + backend — there is no
  # in-repo fake. Like the openapi-drift gate below, this needs a live target, so
  # it is SKIPPED until the repo variable E2E_BASE_URL points at a deployed app
  # (backed by a real backend with the asserted word seeded + succeeded). Node is
  # a required prerequisite — Playwright closed Bun support, so `bunx playwright
  # test`, NEVER `--bun` (oven-sh/bun#8222). chromium is installed for page-based
  # specs added later.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node (Playwright runs on Node, never --bun)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - name: Run e2e
        run: bun run --filter '@kotodama/e2e' test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  # OpenAPI drift gate (D4): regenerate schema.gen.ts from the backend's LIVE
  # /api/openapi.json and fail on a dirty diff. There is no committed
  # openapi.json, so this REQUIRES a reachable backend — set the repo variable
  # KOTODAMA_API_URL to a pinned staging/preview URL (or spin the backend up in
  # a prior step). The job is skipped when the variable is unset, so the empty
  # foundation stays green until a backend URL exists.
  openapi-drift:
    name: openapi drift gate
    runs-on: ubuntu-latest
    if: ${{ vars.KOTODAMA_API_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Regenerate the typed client from the live OpenAPI doc
        run: bun run gen:api
        env:
          KOTODAMA_API_URL: ${{ vars.KOTODAMA_API_URL }}
      - name: Fail on drift
        run: |
          if ! git diff --exit-code platform/api-client/src/schema.gen.ts; then
            echo "::error::schema.gen.ts is out of date — run 'bun run gen:api' and commit the result."
            exit 1
          fi

  # Token drift gate: regenerate ui/src/tokens.css from src/tokens.ts (the hex
  # source of truth) and fail on a dirty diff. Unlike openapi-drift this needs no
  # backend — the source is in-repo — so it always runs.
  tokens-drift:
    name: tokens drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Regenerate the token stylesheet from tokens.ts
        run: bun run gen:tokens
      - name: Fail on drift
        run: |
          if ! git diff --exit-code ui/src/tokens.css; then
            echo "::error::tokens.css is out of date — run 'bun run gen:tokens' and commit the result."
            exit 1
          fi
